name: CodexRadar
options:
  bundleIdPrefix: com.codexradar
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.codexradar.app
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  CodexRadar:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: CodexRadar
        CFBundleDisplayName: CodexRadar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "© 2026 CodexRadar"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codexradar.app
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    postBuildScripts:
      - name: Render Preview States
        basedOnDependencyAnalysis: false
        showEnvVarsInLog: false
        script: |
          if [ "${CONFIGURATION}" = "Debug" ] && [ "${CODEX_RADAR_SKIP_PREVIEW_RENDER:-0}" != "1" ]; then
            "${SRCROOT}/Tools/render_preview_states.sh" "${SRCROOT}/build/preview-renders"
          fi
